<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="soyb &amp; Hon · 从 2026.04.28 开始">
<meta name="theme-color" content="#faf6f0">
<title>韩思琪我喜欢你</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #faf6f0;
    font-family: 'Noto Serif SC', 'SimSun', serif;
    color: #2c2c2c;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 50px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* animated background */
  .bg-orbs {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0; overflow: hidden;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.18;
    animation: orbFloat 18s ease-in-out infinite;
  }
  .orb:nth-child(1) { width: 320px; height: 320px; background: #c8965a; top: 10%; left: 10%; animation-delay: 0s; }
  .orb:nth-child(2) { width: 280px; height: 280px; background: #b8756b; top: 50%; right: 5%; animation-delay: -6s; }
  .orb:nth-child(3) { width: 240px; height: 240px; background: #e8d5b8; bottom: 10%; left: 30%; animation-delay: -12s; }
  @keyframes orbFloat {
    0%,100% { transform: translate(0,0) scale(1); }
    33% { transform: translate(30px,-20px) scale(1.05); }
    66% { transform: translate(-20px,30px) scale(0.95); }
  }

  /* sparkles */
  .sparkles {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1; overflow: hidden;
  }
  .sparkle {
    position: absolute;
    color: #c8965a;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50% { opacity: 0.6; transform: scale(1) rotate(180deg); }
  }

  body > * { position: relative; z-index: 2; }

  /* —— 实时时钟（置于「此刻」卡片上方） —— */
  .clock {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin: 4px 0 18px;
    animation: fadeUp 1s ease-out 0.35s both;
  }
  .clock .time {
    font-size: clamp(28px, 7.5vw, 38px);
    font-weight: 700;
    letter-spacing: 3px;
    color: #c8965a;
    font-variant-numeric: tabular-nums;   /* 等宽数字，秒跳不抖动 */
    line-height: 1;
    text-shadow: 0 2px 18px rgba(200,150,90,0.22);
  }
  .clock .time .sec {
    font-size: 0.5em;
    font-weight: 600;
    color: #b8756b;
    margin-left: 6px;
    letter-spacing: 1px;
  }
  .clock .date {
    font-size: 11px;
    color: #a89e94;
    letter-spacing: 4px;
  }
  .clock .date .dot { color: #c8965a; margin: 0 7px; opacity: .6; }
  /* 时钟与卡片之间的一道细渐隐分隔，视觉上把两者绑成一组 */
  .clock::after {
    content: '';
    display: block;
    width: 76px;
    height: 1px;
    margin-top: 4px;
    background: linear-gradient(90deg, transparent, rgba(200,150,90,0.45), transparent);
  }

  /* title */
  .title-wrap {
    text-align: center;
    margin-bottom: 10px;
  }
  .crown {
    font-size: 20px;
    letter-spacing: 12px;
    color: #c8965a;
    margin-bottom: 16px;
    animation: fadeDown 1s ease-out;
  }
  h1 {
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #c8965a 0%, #b8756b 50%, #c8965a 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite, fadeDown 1s ease-out;
  }
  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .sub {
    font-size: 11px;
    color: #b8756b;
    letter-spacing: 6px;
    margin-top: 14px;
    opacity: 0.75;
    animation: fadeDown 1s ease-out 0.2s both;
  }
  .heart-sep {
    margin: 32px 0;
    font-size: 14px;
    color: #c8965a;
    letter-spacing: 8px;
    opacity: 0.5;
    animation: fadeDown 1s ease-out 0.3s both;
  }

  /* —— 每日诗句 —— */
  .poem {
    max-width: 560px;
    width: 100%;
    text-align: center;
    padding: 36px 30px 30px;
    margin-bottom: 44px;
    border-top: 1px solid rgba(200,150,90,0.22);
    border-bottom: 1px solid rgba(200,150,90,0.22);
    animation: fadeUp 1s ease-out 0.45s both;
  }
  .poem .quote-mark {
    font-size: 26px;
    color: #c8965a;
    line-height: 1;
    opacity: 0.55;
    margin-bottom: 14px;
    display: block;
  }
  .poem .verse {
    font-size: 16px;
    line-height: 2.35;
    color: #4a453f;
    letter-spacing: 1.5px;
    white-space: pre-line;
  }
  .poem .meta {
    margin-top: 22px;
    font-size: 12px;
    color: #b8756b;
    letter-spacing: 3px;
    opacity: 0.85;
  }
  .poem .meta .author { color: #c8965a; }
  .poem .meta .source { margin-left: 8px; opacity: 0.8; }
  .poem .origin {
    margin-top: 8px;
    font-size: 10.5px;
    color: #a89e94;
    letter-spacing: 1px;
    font-style: italic;
    opacity: 0.85;
  }
  .poem .origin:empty { display: none; }

  /* —— 恋爱天数主卡 —— */
  .msg {
    max-width: 560px;
    text-align: center;
    color: #6b6560;
    padding: 40px 32px;
    background: rgba(255,255,255,0.55);
    border-radius: 20px;
    border: 1px solid rgba(200,150,90,0.18);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.04);
    margin-bottom: 44px;
    animation: fadeUp 1s ease-out 0.4s both;
  }
  .days-label {
    font-size: 14px;
    letter-spacing: 4px;
    color: #8a837c;
  }
  .days-num {
    font-size: clamp(56px, 15vw, 76px);
    font-weight: 900;
    line-height: 1.25;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #c8965a, #b8756b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-variant-numeric: tabular-nums;
    margin: 6px 0;
  }
  .days-since {
    font-size: 12px;
    letter-spacing: 3px;
    color: #a89e94;
  }

  /* —— 临近节日倒计时条 —— */
  .fest-countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    max-width: 560px;
    width: 100%;
    margin: -6px auto 30px;
    padding: 11px 20px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(200,150,90,0.12), rgba(184,117,107,0.10));
    border: 1px solid rgba(200,150,90,0.30);
    animation: fadeDown 1s ease-out 0.25s both;
  }
  .fest-countdown[hidden] { display: none; }
  .fest-countdown .fc-emoji { font-size: 17px; line-height: 1; }
  .fest-countdown .fc-text {
    font-size: 13px;
    letter-spacing: 2px;
    color: #a0713d;
    font-weight: 600;
  }
  .fest-countdown .fc-text b { color: #b8756b; }

  /* —— 节日装饰层（节日当天） —— */
  .fest-deco {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 4; overflow: hidden;
  }
  .fest-deco[hidden] { display: none; }
  .fest-deco .fd-hang {
    position: absolute;
    font-size: 30px;
    animation: fdSway 4.2s ease-in-out infinite;
    transform-origin: top center;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,0.12));
  }
  @keyframes fdSway {
    0%,100% { transform: rotate(-7deg); }
    50%     { transform: rotate(7deg); }
  }
  .fest-deco .fd-fall {
    position: absolute;
    top: -8vh;
    font-size: 17px;
    animation: fdFall linear infinite;
  }
  @keyframes fdFall {
    0%   { transform: translateY(-8vh) rotate(0deg); opacity: 0; }
    8%   { opacity: .85; }
    90%  { opacity: .85; }
    100% { transform: translateY(106vh) rotate(340deg); opacity: 0; }
  }

  /* —— 节日祝贺弹窗 —— */
  .fest-mask {
    position: fixed; inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(30,22,12,0.45);
    backdrop-filter: blur(6px);
    animation: fadeMask .5s ease-out both;
  }
  .fest-mask[hidden] { display: none; }
  @keyframes fadeMask { from { opacity: 0; } to { opacity: 1; } }
  .fest-modal {
    position: relative;
    max-width: 340px;
    width: 100%;
    text-align: center;
    padding: 38px 30px 26px;
    border-radius: 24px;
    background: linear-gradient(160deg, #fffdf8, #faf3e6);
    border: 1px solid rgba(200,150,90,0.35);
    box-shadow: 0 24px 70px rgba(30,22,12,0.35);
    animation: popIn .55s cubic-bezier(.2,.9,.3,1.25) both;
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(26px) scale(.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .fest-modal::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px dashed rgba(200,150,90,0.35);
    border-radius: 19px;
    pointer-events: none;
  }
  .fest-modal .fm-emoji { font-size: 52px; line-height: 1; animation: fdSway 3.6s ease-in-out infinite; }
  .fest-modal .fm-title {
    margin-top: 14px;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #b8756b;
  }
  .fest-modal .fm-text {
    margin-top: 14px;
    font-size: 14px;
    line-height: 2.1;
    color: #6b6560;
  }
  .fest-modal .fm-btn {
    margin-top: 24px;
    padding: 10px 34px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 4px;
    color: #fffdf8;
    background: linear-gradient(135deg, #c8965a, #b8756b);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(200,150,90,0.4);
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .fest-modal .fm-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(200,150,90,0.5); }
  .fest-modal .fm-sig {
    margin-top: 16px;
    font-size: 10.5px;
    letter-spacing: 3px;
    color: #c0b6ab;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* photos —— 单张轮换，保持原始比例（竖幅 3:4） */
  .photo-stage {
    width: 100%;
    max-width: 400px;
    margin-bottom: 40px;
    animation: fadeUp 1s ease-out 0.6s both;
  }
  .photo-frame {
    position: relative;
    padding: 10px;
    background: linear-gradient(135deg, #e8d5b8, #f5efe6, #e8d0cb);
    border-radius: 14px;
    box-shadow: 0 10px 34px rgba(0,0,0,0.08);
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1), box-shadow 0.5s ease;
    transform: rotate(-0.6deg);
  }
  .photo-frame:hover {
    transform: translateY(-6px) rotate(0deg) scale(1.012);
    box-shadow: 0 16px 44px rgba(0,0,0,0.13);
  }
  .photo-frame img {
    display: block;
    width: 100%;
    height: auto;              /* 关键：保持原始纵横比，绝不拉伸 */
    border-radius: 10px;
  }
  .photo-frame::after {
    content: '';
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(200,150,90,0.2);
    border-radius: 11px;
    pointer-events: none;
  }

  /* 切换淡入 */
  .photo-frame img.swap { animation: photoIn .85s cubic-bezier(.2,.8,.2,1); }
  @keyframes photoIn {
    from { opacity: 0; transform: scale(1.035); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* 轮换指示点 */
  .photo-dots {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin-top: 18px;
  }
  .photo-dots button {
    width: 6px; height: 6px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(200,150,90,0.28);
    cursor: pointer;
    transition: background .4s ease, transform .4s ease, width .4s ease;
  }
  .photo-dots button.on {
    background: #c8965a;
    width: 20px;
    border-radius: 3px;
  }
  .photo-dots button:hover { background: rgba(200,150,90,0.6); }

  /* vow section */
  .vow {
    max-width: 560px;
    margin-top: 40px;
    padding: 32px 28px;
    background: linear-gradient(135deg, rgba(200,150,90,0.08), rgba(184,117,107,0.08));
    border-radius: 20px;
    border: 1px solid rgba(200,150,90,0.2);
    text-align: center;
    animation: fadeUp 1s ease-out 1s both;
  }
  .vow .label {
    font-size: 10px;
    letter-spacing: 6px;
    color: #c8965a;
    margin-bottom: 16px;
    opacity: 0.8;
  }
  .vow .text {
    font-size: 13px;
    line-height: 2.4;
    color: #6b6560;
  }
  .vow .text p { margin: 0; }
  .vow .sig {
    margin-top: 20px;
    font-size: 14px;
    color: #b8756b;
    letter-spacing: 4px;
  }

  /* —— 雨夜街角入口 —— */
  .gateway {
    max-width: 560px;
    width: 100%;
    margin-top: 40px;
    animation: fadeUp 1s ease-out 1.15s both;
  }
  .gateway a {
    display: block;
    position: relative;
    overflow: hidden;
    padding: 22px 26px;
    border-radius: 20px;
    text-decoration: none;
    background: linear-gradient(140deg, #0d1428 0%, #141d38 55%, #1b1630 100%);
    border: 1px solid rgba(140,170,235,0.22);
    box-shadow: 0 10px 34px rgba(13,20,40,0.22);
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease;
  }
  .gateway a:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 46px rgba(13,20,40,0.32);
  }
  .gateway .glow {
    position: absolute;
    inset: -40% -10% auto -10%;
    height: 150px;
    background: radial-gradient(ellipse at 26% 60%, rgba(255,190,120,0.20), transparent 68%),
                radial-gradient(ellipse at 78% 30%, rgba(120,175,255,0.16), transparent 66%);
    pointer-events: none;
    animation: gateGlow 9s ease-in-out infinite;
  }
  @keyframes gateGlow {
    0%,100% { opacity: .75; }
    50% { opacity: 1; }
  }
  .gateway .gate-inner {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .gateway .gate-txt .t1 {
    font-size: 15px;
    color: #f0e6d8;
    letter-spacing: 4px;
    font-weight: 600;
  }
  .gateway .gate-txt .t2 {
    margin-top: 9px;
    font-size: 10.5px;
    color: #8fa3cc;
    letter-spacing: 3px;
  }
  .gateway .arrow {
    flex-shrink: 0;
    font-size: 18px;
    color: #c8965a;
    letter-spacing: 0;
    transition: transform .45s ease;
  }
  .gateway a:hover .arrow { transform: translateX(6px); }

  /* bottom */
  .bottom {
    margin-top: 48px;
    font-size: 11px;
    color: #c8965a;
    letter-spacing: 5px;
    opacity: 0.5;
    animation: fadeUp 1s ease-out 1.3s both;
  }

  /* floating hearts canvas */
  .floating-hearts {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 1; overflow: hidden;
  }
  .floating-hearts span {
    position: absolute;
    animation: floatHeart linear infinite;
  }
  @keyframes floatHeart {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    5% { opacity: 0.12; }
    95% { opacity: 0.12; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* star burst on load */
  .burst {
    position: fixed;
    pointer-events: none; z-index: 3;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #c8965a;
    animation: burst 1.5s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(20); opacity: 0; }
  }

  @media (max-width: 400px) {
    h1 { letter-spacing: 5px; }
    .msg { padding: 32px 20px; }
    .poem { padding: 28px 18px 24px; }
    .poem .verse { font-size: 15px; letter-spacing: 1px; }
    .photo-stage { max-width: 100%; }
    .photo-frame { padding: 8px; }
    .clock { margin: 2px 0 14px; }
    .clock .date { letter-spacing: 2px; }
    .fest-countdown { margin: -2px auto 24px; padding: 9px 14px; }
    .fest-countdown .fc-text { font-size: 12px; letter-spacing: 1px; }
    .fest-modal { padding: 32px 22px 22px; }
  }
</style>
</head>
<body>

<div class="bg-orbs">
  <div class="orb"></div>
  <div class="orb"></div>
  <div class="orb"></div>
</div>

<div class="sparkles" id="sparkles"></div>

<div class="floating-hearts" id="hearts"></div>

<!-- 节日装饰层（节日当天出现：角落挂件 + 飘落粒子） -->
<div class="fest-deco" id="festDeco" hidden></div>

<!-- 节日祝贺弹窗（节日当天自动弹一次） -->
<div class="fest-mask" id="festMask" hidden>
  <div class="fest-modal" role="dialog" aria-modal="true">
    <div class="fm-emoji" id="fmEmoji"></div>
    <div class="fm-title" id="fmTitle"></div>
    <div class="fm-text" id="fmText"></div>
    <button class="fm-btn" id="fmBtn" type="button">收到啦</button>
    <div class="fm-sig">&mdash; soyb</div>
  </div>
</div>

<div class="title-wrap">
  <div class="crown">&#10022; &#10022; &#10022;</div>
  <h1>韩思琪我喜欢你</h1>
  <div class="sub">LIKE &middot; LOVE &middot; ALWAYS</div>
</div>

<div class="heart-sep">&#10084; &mdash; &middot; &mdash; &#10084;</div>

<!-- 临近节日倒计时（7 天内自动出现） -->
<div class="fest-countdown" id="festCountdown" hidden>
  <span class="fc-emoji" id="fcEmoji"></span>
  <span class="fc-text" id="fcText"></span>
</div>

<!-- 每日诗句 -->
<div class="poem" id="poem">
  <span class="quote-mark">&#10077;</span>
  <div class="verse" id="poem-verse"></div>
  <div class="meta" id="poem-meta"></div>
  <div class="origin" id="poem-origin"></div>
</div>

<!-- 实时时钟 · 置于「此刻」之上 -->
<div class="clock">
  <div class="time"><span id="clkHM">&mdash;&mdash;:&mdash;&mdash;</span><span class="sec" id="clkS">&mdash;&mdash;</span></div>
  <div class="date" id="clkDate"></div>
</div>

<!-- 恋爱天数 -->
<div class="msg days-card">
  <p class="days-label">这是我们在一起的第</p>
  <div class="days-num" id="daysNum">&mdash;</div>
  <p class="days-since">天 &middot; 自 2026.04.28 起，每一天都在数</p>
</div>

<!-- 照片：单张轮换，原比例不裁切 -->
<div class="photo-stage">
  <div class="photo-frame">
    <img id="photo" src="photos/微信图片_20260722114053_15506_8.webp" alt="夜晚校园林荫道" width="1086" height="1448" loading="eager" decoding="async">
  </div>
  <div class="photo-dots" id="photoDots"></div>
</div>

<div class="vow">
  <div class="label">MY VOW TO YOU</div>
  <div class="text">
    <p>这个数字还会一直长下去</p>
    <p>你说的每一句话我都记得</p>
    <p>以后的路也一起走吧</p>
  </div>
  <div class="sig">forever yours</div>
</div>

<!-- 雨夜街角 3D 场景入口 -->
<div class="gateway">
  <a href="rainy-night/" aria-label="进入一休仓买·雨夜街角">
    <span class="glow"></span>
    <span class="gate-inner">
      <span class="gate-txt">
        <span class="t1">一休仓买 &middot; 雨夜街角</span>
        <span class="t2">RAINY NIGHT &middot; 24H STORE</span>
      </span>
      <span class="arrow">&#8594;</span>
    </span>
  </a>
</div>

<div class="bottom">soyb &amp; Hon &middot; 2026.04.28 &rarr; &#8734;</div>

<script src="poems.js?v=2"></script>
<script src="festivals.js?v=1"></script>
<script>
  /* ============ 恋爱天数 ============
   * 「在一起第 N 天」从 2026-04-28 当天算第 1 天，跨零点自动 +1。
   */
  const START_DATE = new Date(2026, 3, 28, 0, 0, 0);    // 2026-04-28 在一起

  const elDays = document.getElementById('daysNum');
  const nf = new Intl.NumberFormat('en-US');

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  /* —— 时钟元素 —— */
  const elHM   = document.getElementById('clkHM');
  const elSec  = document.getElementById('clkS');
  const elDate = document.getElementById('clkDate');
  const WEEK = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

  function renderClock(now){
    elHM.textContent  = pad(now.getHours()) + ':' + pad(now.getMinutes());
    elSec.textContent = pad(now.getSeconds());
    elDate.innerHTML  =
      now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate()) +
      '<span class="dot">&middot;</span>' + WEEK[now.getDay()];
  }

  function render(now){
    // 在一起第 N 天（起始当天 = 第 1 天）
    const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start0 = new Date(START_DATE.getFullYear(), START_DATE.getMonth(), START_DATE.getDate());
    const dayNo  = Math.round((today0 - start0) / 86400000) + 1;
    elDays.textContent = nf.format(dayNo);
  }

  /* ============ 节日系统 ============
   * 1. 临近 7 天内：标题下显示倒计时条
   * 2. 节日当天：页面挂主题装饰 + 自动弹一次祝贺弹窗（每年只弹一次，localStorage 记忆）
   */
  const elFC     = document.getElementById('festCountdown');
  const elFcEmoji= document.getElementById('fcEmoji');
  const elFcText = document.getElementById('fcText');
  const elDeco   = document.getElementById('festDeco');
  const elMask   = document.getElementById('festMask');
  let lastFestDay = -1;

  function renderFest(now){
    // 守卫：festivals.js 若加载失败（CDN 缓存 404 等），跳过节日逻辑但不许拖垮主循环
    if (typeof getFestivalContext !== 'function') return;
    const dayKey = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
    if (dayKey === lastFestDay) return;   // 一天内只需算一次
    lastFestDay = dayKey;

    const ctx = getFestivalContext(now);

    /* —— 倒计时条 —— */
    if (ctx.upcoming && ctx.upcoming.days <= 7){
      elFcEmoji.textContent = ctx.upcoming.fest.emoji;
      const n = ctx.upcoming.days;
      elFcText.innerHTML = (n === 1)
        ? '明天就是 <b>' + ctx.upcoming.fest.name + '</b> 啦'
        : '距离 <b>' + ctx.upcoming.fest.name + '</b> 还有 ' + n + ' 天';
      elFC.hidden = false;
    } else {
      elFC.hidden = true;
    }

    /* —— 当天装饰 + 弹窗 —— */
    if (ctx.active){
      const f = ctx.active;
      const theme = FEST_THEMES[f.theme] || FEST_THEMES.love;
      applyFestDecor(theme);
      // 弹窗：每年每个节日只自动弹一次
      const key = 'fest_greet_' + f.name + '_' + now.getFullYear();
      try {
        if (!localStorage.getItem(key)){
          setTimeout(function(){
            document.getElementById('fmEmoji').textContent = f.emoji;
            document.getElementById('fmTitle').textContent = f.name + '快乐';
            document.getElementById('fmText').textContent  = f.greeting;
            elMask.hidden = false;
            document.getElementById('fmBtn').addEventListener('click', function(){
              elMask.hidden = true;
            });
          }, 1600);
          localStorage.setItem(key, '1');
        }
      } catch(e){ /* localStorage 不可用（隐私模式）则每次都弹 */ }
    }
  }

  /* 按主题挂装饰：四角挂件 + 飘落粒子 */
  function applyFestDecor(theme){
    elDeco.innerHTML = '';
    // 角落挂件：左上 3 个 + 右上 3 个，高低错落
    const spots = [
      { left: '3%',  top: '2.5%', size: 30, delay: 0 },
      { left: '8.5%',top: '5%',   size: 24, delay: .7 },
      { left: '14%', top: '2%',   size: 20, delay: 1.3 },
      { right:'3%',  top: '2.5%', size: 30, delay: .4 },
      { right:'8.5%',top: '5%',   size: 24, delay: 1.0 },
      { right:'14%', top: '2%',   size: 20, delay: 1.6 }
    ];
    spots.forEach(function(s, i){
      const el = document.createElement('span');
      el.className = 'fd-hang';
      el.textContent = theme.hang[i % theme.hang.length];
      el.style.left = s.left; el.style.right = s.right;
      el.style.top = s.top;
      el.style.fontSize = s.size + 'px';
      el.style.animationDelay = s.delay + 's';
      elDeco.appendChild(el);
    });
    // 飘落粒子：12 个，随机横向位置与时长
    for (let i = 0; i < 12; i++){
      const el = document.createElement('span');
      el.className = 'fd-fall';
      el.textContent = theme.fall;
      el.style.left = (Math.random() * 96) + '%';
      el.style.fontSize = (13 + Math.random() * 10) + 'px';
      el.style.animationDuration = (9 + Math.random() * 8) + 's';
      el.style.animationDelay = (Math.random() * 9) + 's';
      elDeco.appendChild(el);
    }
    elDeco.hidden = false;
  }

  /* —— 每日诗句：按自然日取，同一天恒定（加载失败不影响其余功能） —— */
  (function(){
    try {
      if (typeof poemOfDay !== 'function') return;
      const p = poemOfDay(new Date());
      document.getElementById('poem-verse').innerHTML = p.text;
      document.getElementById('poem-meta').innerHTML =
        '<span class="author">' + p.author + '</span>' +
        '<span class="source">' + p.source + '</span>';
      document.getElementById('poem-origin').innerHTML = p.origin || '';
    } catch(e){ /* 诗句系统故障时页面其余功能照常 */ }
  })();

  /* —— 秒级刷新 —— */
  let lastSecond = -1;
  function loop(){
    const now = new Date();
    if (now.getSeconds() !== lastSecond){
      lastSecond = now.getSeconds();
      renderClock(now);
      render(now);
      // 跨天时节日状态需要重算（倒计时条出现/弹窗触发）；任何异常不许中断主循环
      try { renderFest(now); } catch(e){ /* 节日系统故障时页面其余功能照常 */ }
    }
    requestAnimationFrame(loop);
  }

  renderClock(new Date());
  render(new Date());
  try { renderFest(new Date()); } catch(e){}

  // 页面离开/切后台时暂停重绘，回来后立刻同步
  let rafId = null;
  function start(){ if (rafId === null) rafId = requestAnimationFrame(loop); }
  function stop(){ if (rafId !== null){ cancelAnimationFrame(rafId); rafId = null; } }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stop();
    else { const n = new Date(); renderClock(n); render(n); try { renderFest(n); } catch(e){} start(); }
  });
  start();
</script>

<script>
  /* —— 照片轮换：两张交替，8 秒一张，点击可手动切换 —— */
  (function(){
    const PHOTOS = [
      { src: 'photos/微信图片_20260722114053_15506_8.webp', w: 1086, h: 1448 },
      { src: 'photos/微信图片_20260722114053_15507_8.webp', w: 1086, h: 1448 }
    ];
    const img  = document.getElementById('photo');
    const dots = document.getElementById('photoDots');
    let idx = 0, timer = null, paused = false;

    // 预加载第二张，切换时不闪白
    const pre = new Image(); pre.src = PHOTOS[1].src;

    PHOTOS.forEach(function(_, i){
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', '第 ' + (i + 1) + ' 张照片');
      b.addEventListener('click', function(){ show(i); restart(); });
      dots.appendChild(b);
    });

    function show(i){
      idx = ((i % PHOTOS.length) + PHOTOS.length) % PHOTOS.length;
      const p = PHOTOS[idx];
      img.classList.remove('swap');
      // 强制重排让动画重放
      void img.offsetWidth;
      img.src = p.src;
      img.width = p.w;
      img.height = p.h;
      img.classList.add('swap');
      Array.prototype.forEach.call(dots.children, function(d, k){
        d.classList.toggle('on', k === idx);
      });
    }

    function start(){ if (timer === null && !paused) timer = setInterval(function(){ show(idx + 1); }, 8000); }
    function stop(){ if (timer !== null){ clearInterval(timer); timer = null; } }
    function restart(){ stop(); start(); }

    // 页面在后台时不轮换，省电
    document.addEventListener('visibilitychange', function(){
      paused = document.hidden;
      if (paused) stop(); else start();
    });

    // 鼠标悬停在照片上时暂停轮换，方便看清
    const stage = img.closest('.photo-stage');
    stage.addEventListener('mouseenter', stop);
    stage.addEventListener('mouseleave', start);

    show(0);
    start();
  })();
</script>

<script>
  // sparkles
  const sp = document.getElementById('sparkles');
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('span');
    s.className = 'sparkle';
    s.innerHTML = '&#10022;';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.fontSize = (8 + Math.random() * 12) + 'px';
    sp.appendChild(s);
  }

  // floating hearts
  const hearts = document.getElementById('hearts');
  const symbols = ['&#10084;','&#10085;','&#10047;','&#127775;'];
  function spawnHeart() {
    const el = document.createElement('span');
    el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (10 + Math.random() * 14) + 'px';
    el.style.animationDuration = (10 + Math.random() * 15) + 's';
    hearts.appendChild(el);
    setTimeout(() => el.remove(), 28000);
  }
  for (let i = 0; i < 8; i++) spawnHeart();
  setInterval(spawnHeart, 4000);

  // burst on load
  setTimeout(() => {
    const b = document.createElement('div');
    b.className = 'burst';
    b.style.left = '50%'; b.style.top = '40%';
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 2000);
  }, 500);
</script>

</body>
